<svg xmlns="http://www.w3.org/2000/svg" width="520" height="385" viewBox="0 0 520 385">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.bg{fill:#0d1117}.frame{fill:none;stroke:#30363d;stroke-width:2}
.muted{fill:#7d8590;font-size:14px}.ink{fill:#c9d1d9;font-size:11px;font-weight:700}.title{fill:#c9d1d9;font-size:14px;font-weight:700}
.line{opacity:0;animation:type .7s ease-out forwards}.cursor{animation:blink 1s steps(1,end) infinite}
@keyframes type{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
</style>
